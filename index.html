<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Notion</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;color:#37352f}button,input,textarea,select{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit;border-radius:5px;padding:8px}button:hover{background:#e9e9e8}.app{display:flex;height:100vh}.nav{width:270px;background:#f7f7f5;border-right:1px solid #eee;display:flex;flex-direction:column;padding:14px;gap:10px}.brand{font-size:18px;font-weight:bold}.search{padding:10px;width:100%;border:1px solid #ddd;border-radius:5px}.tree{flex:1;overflow:auto}.item{display:flex;align-items:center;border-radius:5px}.item.active{background:#e9e9e7}.item button:first-child{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{flex:1;overflow:auto}.page{max-width:930px;margin:60px auto;padding:0 40px}.title{border:0;outline:0;width:100%;font-size:36px;font-weight:700;margin:35px 0 15px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{background:#f3f3f1}.editor{display:block;width:100%;min-height:410px;resize:vertical;border:1px solid #eee;border-radius:8px;padding:14px;line-height:1.8;font-family:Consolas,monospace}.preview{line-height:1.8;overflow-wrap:anywhere}.preview img{max-width:100%}.preview blockquote{border-left:3px solid #ddd;padding-left:12px}.status{min-height:25px;color:#777;font-size:12px}.hint{color:#777;font-size:12px}.blank{margin:130px auto;text-align:center;color:#999}.danger{color:#b42318}@media(max-width:700px){.nav{width:170px;padding:7px}.page{padding:10px;margin:20px auto}.title{font-size:28px}}
</style></head><body><div class="app"><aside class="nav"><div class="brand">▤ Local Notion</div><input class="search" id="search" placeholder="전체 검색"><button id="add">＋ 새 페이지</button><div class="tree" id="tree"></div><div class="hint">오프라인 업무 위키</div></aside><main class="main"><div class="blank" id="blank">페이지를 선택하세요</div><div class="page" id="page" hidden><div class="actions"><button id="mode">미리보기</button><button id="image">이미지 업로드</button><input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden><select id="parent"></select><button id="save">저장</button><button id="privacy">🔒 개인 페이지</button><button class="danger" id="delete">삭제</button></div><input id="title" class="title" placeholder="제목" maxlength="200"><div class="status" id="status"></div><textarea id="editor" class="editor" placeholder="Markdown으로 내용을 작성하세요..."></textarea><div id="preview" class="preview" hidden></div></div></main></div><script>
const $=id=>document.getElementById(id);let pages=[],current=null,ver=0,dirty=false,show=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){return esc(s).replace(/!\[([^\]]*)\]\((\/assets\/[a-f0-9]{32}\.(?:png|jpg|gif|webp))\)/g,'<img src="$2" alt="$1">').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function md(s){let list=false,out='';for(let line of s.split('\n')){let x;if((x=/^[-*] (.+)/.exec(line))){if(!list){out+='<ul>';list=true}out+='<li>'+inline(x[1])+'</li>';continue}if(list){out+='</ul>';list=false}if((x=/^(#{1,3}) (.*)/.exec(line)))out+='<h'+x[1].length+'>'+inline(x[2])+'</h'+x[1].length+'>';else if(line.startsWith('> '))out+='<blockquote>'+inline(line.slice(2))+'</blockquote>';else out+=line.trim()?'<p>'+inline(line)+'</p>':'<br>'}return out+(list?'</ul>':'')}
async function api(path,payload){let opts=payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)};let res=await fetch(path,opts),value=await res.json();if(!res.ok)throw Error(value.error||'요청 실패');return value}
function mayLeave(){return !dirty||confirm('저장되지 않은 변경사항이 있습니다. 이동할까요?')}
async function load(id){pages=(await api('/api/pages')).pages;if(id)open(id);else if(current&&pages.some(p=>p.id===current.id))open(current.id);else if(pages.length)open(pages[0].id);draw()}
function descendants(id){let found=new Set([id]),changed=true;while(changed){changed=false;for(let p of pages)if(found.has(p.parent_id)&&!found.has(p.id)){found.add(p.id);changed=true}}return found}
function draw(){let holder=$('tree');holder.replaceChildren();let q=$('search').value.toLowerCase(),matches=new Set(pages.filter(p=>(p.title+' '+p.content).toLowerCase().includes(q)).map(p=>p.id));function includesChild(id){return pages.some(p=>p.parent_id===id&&(matches.has(p.id)||includesChild(p.id)))}function addChildren(parent,depth){for(let p of pages.filter(p=>p.parent_id===parent)){if(q&&!matches.has(p.id)&&!includesChild(p.id))continue;let row=document.createElement('div');row.className='item'+(current?.id===p.id?' active':'');row.style.paddingLeft=(depth*11)+'px';let btn=document.createElement('button');btn.textContent='▤ '+p.title;btn.onclick=()=>{if(mayLeave())open(p.id)};let child=document.createElement('button');child.textContent='+';child.title='하위 페이지';child.onclick=()=>create(p.id);row.append(btn,child);holder.append(row);addChildren(p.id,depth+1)}}addChildren(null,0)}
function view(){ $('editor').hidden=show;$('preview').hidden=!show;$('mode').textContent=show?'편집':'미리보기';if(show)$('preview').innerHTML=md($('editor').value)}
async function open(id){current=pages.find(p=>p.id===id);if(!current)return;if(current.locked){let password=prompt('이 페이지의 암호를 입력하세요.');if(password===null)return;try{await api('/api/unlock',{id,password});pages=(await api('/api/pages')).pages;current=pages.find(p=>p.id===id);if(current.locked){alert('상위 개인 페이지도 잠금 해제해야 합니다.');return}}catch(e){alert(e.message);return}}ver=current.version;dirty=false;$('blank').hidden=true;$('page').hidden=false;$('title').value=current.title;$('editor').value=current.content;$('status').textContent='';let select=$('parent');select.replaceChildren();let option=document.createElement('option');option.value='';option.textContent='최상위 페이지';select.append(option);let excluded=descendants(id);for(let p of pages){if(excluded.has(p.id))continue;let o=document.createElement('option');o.value=p.id;o.textContent=p.title;select.append(o)}select.value=current.parent_id||'';view();draw()}
async function create(parent){if(!mayLeave())return;try{let a=await api('/api/pages',{title:'새 페이지',parent_id:parent});await load(a.id)}catch(e){alert(e.message)}}
async function save(){if(!current)return;try{let a=await api('/api/save',{id:current.id,title:$('title').value,content:$('editor').value,parent_id:$('parent').value||null,version:ver});ver=a.version;dirty=false;await load(current.id);$('status').textContent='저장 완료'}catch(e){alert(e.message)}}
async function privacy(){if(!current)return;let old=null;if(current.private){old=prompt('현재 페이지 암호를 입력하세요.');if(old===null)return}const next=prompt('새 개인 페이지 암호 (8자 이상). 잠금을 해제하려면 비워 두세요.');if(next===null)return;try{await api('/api/privacy',{id:current.id,password:next||null,old_password:old});alert(next?'개인 페이지 암호가 설정되었습니다.':'개인 페이지 잠금을 해제했습니다.');await load(current.id)}catch(e){alert(e.message)}}
async function del(){if(!current||!confirm('이 페이지와 모든 하위 페이지를 삭제할까요?'))return;try{await api('/api/delete',{id:current.id});current=null;$('page').hidden=true;$('blank').hidden=false;await load()}catch(e){alert(e.message)}}
async function upload(file){if(!file)return;try{let r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':file.type,'X-Page-ID':current.id},body:file});let a=await r.json();if(!r.ok)throw Error(a.error);$('editor').value+='\n!['+file.name.replace(/[\[\]()]/g,'')+']('+a.url+')\n';dirty=true;view();$('status').textContent='이미지가 추가되었습니다. 저장을 눌러주세요.'}catch(e){alert(e.message)}}
$('privacy').onclick=privacy;$('add').onclick=()=>create(null);$('save').onclick=save;$('delete').onclick=del;$('mode').onclick=()=>{show=!show;view()};$('image').onclick=()=>$('file').click();$('file').onchange=e=>upload(e.target.files[0]);$('search').oninput=draw;for(let id of ['title','editor','parent'])$(id).addEventListener(id==='parent'?'change':'input',()=>{dirty=true;$('status').textContent='저장되지 않음'});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load().catch(e=>$('blank').textContent=e.message);
</script></body></html>
