<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Notion · 시각적 편집기</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",Arial,sans-serif;color:#302f2d;background:white}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:6px;padding:8px;background:transparent}button:hover{background:#eee}button:disabled{opacity:.35;cursor:default}.shell{display:flex;height:100vh}.side{width:250px;flex:none;background:#f7f7f5;border-right:1px solid #ddd;padding:16px;overflow:auto}.side button{width:100%;text-align:left}.side input{padding:8px;border:1px solid #ddd;border-radius:6px;width:100%}.doc{flex:1;overflow:auto}.wrap{max-width:950px;margin:28px auto;padding:0 35px}.bar{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-bottom:1px solid #eee;position:sticky;top:0;background:white;z-index:3}.bar button{border:1px solid #e6e6e6;min-width:32px}.bar select{border:1px solid #ddd;border-radius:5px}.title{font-size:36px;font-weight:700;outline:none;border:0;width:100%;margin:32px 0 12px}.body{min-height:45vh;outline:none;font-size:16px;line-height:1.75;white-space:normal;overflow-wrap:anywhere}.body[contenteditable=false]{opacity:.91}.body:empty:before{content:"문서를 작성하거나 /를 입력하세요";color:#aaa}.body img{display:block;max-width:100%;margin:12px 0;cursor:pointer}.body img.selected{outline:2px solid #8c9aeb}.body table{border-collapse:collapse;width:100%;margin:12px 0}.body th,.body td{border:1px solid #ccc;padding:6px;min-width:50px}.body blockquote{border-left:3px solid #ddd;padding-left:12px;color:#555}.body details{border:1px solid #eee;border-radius:6px;padding:8px}.body .callout{background:#f4f4f1;border-radius:8px;padding:12px}.body label.todo{display:block;padding:3px 0}.note{font-size:12px;color:#777}.menu{position:fixed;background:white;border:1px solid #ddd;box-shadow:0 12px 32px #0002;border-radius:8px;padding:6px;width:280px;max-height:320px;overflow:auto;z-index:10}.menu button{display:block;width:100%;text-align:left}.menu button.chosen{background:#e9ebef}.hidden{display:none!important}.entry{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px}.entry.active{background:#e6e6e3}.status{font-size:12px;color:#656565;min-height:20px}.warn{padding:8px 10px;background:#fff6e3;border-radius:6px;margin-top:15px;font-size:12px}@media(max-width:650px){.side{width:130px;padding:8px}.wrap{padding:0 12px}.title{font-size:27px}}
@media print{.side,.bar,.status,.warn{display:none!important}.doc{overflow:visible}.wrap{margin:0;max-width:none}.body{min-height:0}}
</style></head><body><div class="shell"><aside class="side"><strong>▤ Local Notion</strong><p class="note">시각적 편집기 · 사내 공유 폴더</p><button id="legacy">← 기존 관리 화면</button><button id="create">＋ 새 페이지</button><button id="backlinks">연결 문서 보기</button><button id="refresh">↻ 새로고침</button><input id="search" placeholder="검색"><div id="tree"></div><p class="note" id="owner"></p></aside><main class="doc"><div class="wrap"><div class="bar">
<button id="edit">편집 시작</button><button id="save" disabled>저장</button><button id="stop" disabled>편집 종료</button><select id="block" title="문단 스타일"><option value="p">일반</option><option value="h1">제목 1</option><option value="h2">제목 2</option><option value="h3">제목 3</option></select>
<button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><button id="highlight">형광펜</button><button id="check">☐ 체크</button><button id="toggle">▸ 토글</button><button id="table">▦ 표</button><button id="link">🔗 링크</button><button id="image">이미지</button><button id="file">첨부</button><button id="pdf">PDF</button>
<input type="file" id="imagefile" accept="image/png,image/jpeg,image/gif,image/webp" hidden><input type="file" id="attachfile" accept=".pdf,.docx,.xlsx,.pptx,.csv" hidden></div>
<p class="status" id="status">페이지를 선택해 주세요.</p><div id="related" class="warn hidden"></div><input class="title" id="title" placeholder="페이지 제목" disabled><div id="body" class="body" contenteditable="false"></div><div id="menu" class="menu hidden"></div><p class="warn">문서별 편집 잠금을 유지합니다. 비정상 종료하면 잠금이 남을 수 있습니다. 민감한 개인 문서는 이 공유 편집기에 넣지 마세요.</p></div></main></div>
<script>
const $=id=>document.getElementById(id);let token='',pages=[],page=null,lock=null,dirty=false,slash=null,menuIndex=0;
const clean=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allowed=new Set(['P','DIV','BR','H1','H2','H3','B','STRONG','I','EM','U','S','DEL','MARK','UL','OL','LI','BLOCKQUOTE','HR','DETAILS','SUMMARY','TABLE','THEAD','TBODY','TR','TH','TD','A','IMG','LABEL','INPUT','SPAN']);
function sanitize(source){
 const t=document.createElement('template');t.innerHTML=source;
 function walk(node){for(const child of [...node.childNodes]){
  if(child.nodeType===8){child.remove();continue}
  if(child.nodeType!==1){if(child.nodeType!==3)child.remove();continue}
  if(!allowed.has(child.tagName)){if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH','FORM','META'].includes(child.tagName)){child.remove();continue}child.replaceWith(...child.childNodes);safeWalk(node);continue}
  for(const attr of [...child.attributes])child.removeAttribute(attr.name);
  if(child.tagName==='A'){const old=nodeValue(child,'href');if(old&&(/^#page-[0-9a-f]{32}$/.test(old)||/^\/attachments\/[0-9a-f]{32}\.(pdf|docx|xlsx|pptx|csv)$/.test(old)))child.setAttribute('href',old)}
  if(child.tagName==='IMG'){const src=nodeValue(child,'src');if(!/^\/images\/[0-9a-f]{32}\.(png|jpg|gif|webp)$/.test(src||'')){child.remove();continue}child.setAttribute('src',src);const w=Number(nodeValue(child,'data-width'));if(w>=80&&w<=1200)child.setAttribute('width',String(Math.round(w)))}
  if(child.tagName==='INPUT'){if(nodeValue(child,'type')==='checkbox'){child.setAttribute('type','checkbox');if(nodeValue(child,'checked')==='true')child.setAttribute('checked','')}else child.remove()}
  if(child.tagName==='LABEL'&&nodeValue(child,'class')==='todo')child.className='todo';
  if(child.tagName==='DIV'&&nodeValue(child,'class')==='callout')child.className='callout';
  walk(child)
 }}
 function nodeValue(node,key){return node.getAttribute(key)}
 // Keep only purpose-built structural attributes, ignoring paste styles and event handlers.
 function safeWalk(node){for(const child of [...node.children]){
 const attrs={};for(const name of ['href','src','width','type','checked','class'])attrs[name]=child.getAttribute(name);
 if(!allowed.has(child.tagName)){if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH','FORM'].includes(child.tagName)){child.remove();continue}child.replaceWith(...child.childNodes);continue}
 for(const a of [...child.attributes])child.removeAttribute(a.name);
 if(child.tagName==='A'&&attrs.href&&(/^#page-[0-9a-f]{32}$/.test(attrs.href)||/^\/attachments\/[0-9a-f]{32}\.(pdf|docx|xlsx|pptx|csv)$/.test(attrs.href)))child.setAttribute('href',attrs.href);
 if(child.tagName==='IMG'){if(!/^\/images\/[a-f0-9]{32}\.(png|jpg|gif|webp)$/.test(attrs.src||'')){child.remove();continue}child.setAttribute('src',attrs.src);let width=Number(attrs.width);if(width>=80&&width<=1200)child.setAttribute('width',String(Math.round(width)))}
 if(child.tagName==='INPUT'){if(attrs.type!=='checkbox'){child.remove();continue}child.type='checkbox';if(attrs.checked!==null)child.setAttribute('checked','')}
 if(child.tagName==='LABEL'&&attrs.class==='todo')child.className='todo';
 if(child.tagName==='DIV'&&attrs.class==='callout')child.className='callout';
 safeWalk(child)
 }}
 safeWalk(t.content);return t.innerHTML
}
function legacy(content){if(content.startsWith('<!--LOCAL_WYSIWYG_V1-->'))return sanitize(content.slice('<!--LOCAL_WYSIWYG_V1-->'.length));return content.split('\n').map(x=>{if(/^- \[[xX ]\] /.test(x))return '<label class="todo"><input type="checkbox" '+(/^-\s\[[xX]\]/.test(x)?'checked':'')+'> '+clean(x.slice(6))+'</label>';if(x.startsWith('### '))return '<h3>'+clean(x.slice(4))+'</h3>';if(x.startsWith('## '))return '<h2>'+clean(x.slice(3))+'</h2>';if(x.startsWith('# '))return '<h1>'+clean(x.slice(2))+'</h1>';if(x.startsWith('> '))return '<blockquote>'+clean(x.slice(2))+'</blockquote>';if(/^---$/.test(x))return '<hr>';return '<p>'+clean(x)+'</p>'}).join('')}
async function api(route,obj){let res=await fetch('/api/'+route,{method:obj===undefined?'GET':'POST',headers:{'X-Local-Token':token,...(obj===undefined?{}:{'Content-Type':'application/json'})},body:obj===undefined?undefined:JSON.stringify(obj)});let data=await res.json();if(!res.ok)throw Error(data.error||'요청 오류');return data}
function status(s){$('status').textContent=s}
function editing(v){$('body').contentEditable=v?'true':'false';$('title').disabled=!v;$('edit').disabled=v;$('save').disabled=!v;$('stop').disabled=!v;[...document.querySelectorAll('.bar [data-cmd],#block,#highlight,#check,#toggle,#table,#link,#image,#file')].forEach(x=>x.disabled=!v);if(!v)hideMenu()}
async function leave(){if(!lock)return true;if(dirty&&!confirm('저장하지 않은 내용을 버릴까요? 임시 초안도 삭제됩니다.'))return false;if(dirty)discardDraft();try{await api('unlock',{id:page.id,lock_token:lock})}catch(e){alert(e.message);return false}lock=null;dirty=false;editing(false);return true}
function renderTree(){const q=$('search').value.toLowerCase();$('tree').replaceChildren();for(const p of pages.filter(p=>((p.title+' '+p.content.replace(/<[^>]*>/g,' '))).toLowerCase().includes(q))){const b=document.createElement('button');b.className='entry'+(page?.id===p.id?' active':'');b.textContent=p.title+(p.lock?' 🔒':'');b.onclick=()=>openPage(p.id);$('tree').append(b)}}
async function openPage(id){if(!await leave())return;page=pages.find(p=>p.id===id);if(!page)return;$('title').value=page.title;$('body').innerHTML=legacy(page.content);editing(false);$('related').classList.add('hidden');status(page.lock?'현재 다른 직원이 편집 중입니다':'읽기 모드 — 편집 시작을 눌러 주세요');renderTree()}
async function refresh(){if(lock)return status('먼저 저장하거나 편집을 종료해 주세요');pages=(await api('pages')).pages;if(page&&pages.some(p=>p.id===page.id))await openPage(page.id);else if(pages.length)await openPage(pages[0].id);renderTree()}
async function start(){if(!page)return;try{let data=await api('lock',{id:page.id});lock=data.lock_token;editing(true);recoverDraft();$('body').focus();status('편집 잠금 확보 · 저장 버튼을 눌러 반영하세요')}catch(e){alert(e.message);await refresh()}}
async function save(){if(!lock)return;const content='<!--LOCAL_WYSIWYG_V1-->'+sanitize($('body').innerHTML);try{const result=await api('save',{id:page.id,lock_token:lock,version:page.version,title:$('title').value,parent_id:page.parent_id,content});page.version=result.version;dirty=false;discardDraft();await leave();await refresh();status('저장 완료')}catch(e){alert(e.message)}}
async function create(){if(!await leave())return;const r=await api('create',{title:'새 페이지',parent_id:null});await refresh();await openPage(r.id);await start()}
function insertHtml(html){if(!lock)return;const safe=sanitize(html);$('body').focus();const sel=getSelection();if(!sel||!sel.rangeCount){$('body').insertAdjacentHTML('beforeend',safe)}else{const r=sel.getRangeAt(0);r.deleteContents();const t=document.createElement('template');t.innerHTML=safe;const fragment=t.content,last=fragment.lastChild;r.insertNode(fragment);if(last){r.setStartAfter(last);r.collapse(true);sel.removeAllRanges();sel.addRange(r)}}dirty=true}
function exec(name,value){if(!lock)return;$('body').focus();document.execCommand(name,false,value);dirty=true}
function replaceCurrent(text){const sel=getSelection();if(!sel?.rangeCount)return;const range=sel.getRangeAt(0);range.deleteContents();range.insertNode(document.createTextNode(text));range.collapse(false);dirty=true}
function todo(){insertHtml('<label class="todo"><input type="checkbox"> 해야 할 일</label><p></p>')}
function toggle(){insertHtml('<details open><summary>제목</summary><p>접을 내용을 입력하세요</p></details><p></p>')}
function addTable(){let rows=Math.max(1,Math.min(30,Number(prompt('행 개수',3))||3)),cols=Math.max(1,Math.min(12,Number(prompt('열 개수',3))||3));let html='<table><tbody>';for(let i=0;i<rows;i++){html+='<tr>';for(let j=0;j<cols;j++)html+='<td>내용</td>';html+='</tr>'}insertHtml(html+'</tbody></table><p></p>')}
function apply(cmd){if(cmd==='todo')todo();else if(cmd==='toggle')toggle();else if(cmd==='table')addTable();else if(cmd==='divider')insertHtml('<hr><p></p>');else if(cmd==='callout')insertHtml('<div class="callout">메모</div><p></p>');else if(cmd==='quote')exec('formatBlock','blockquote');else if(cmd==='bullet')exec('insertUnorderedList');else if(cmd==='number')exec('insertOrderedList');else exec('formatBlock',cmd==='text'?'p':cmd)}
const blocks=[['일반 텍스트','text'],['제목 1','h1'],['제목 2','h2'],['제목 3','h3'],['체크리스트','todo'],['글머리 목록','bullet'],['번호 목록','number'],['인용문','quote'],['구분선','divider'],['토글','toggle'],['콜아웃','callout'],['표','table']];
function slashInfo(){const sel=getSelection();if(!sel?.rangeCount||!$('body').contains(sel.anchorNode))return null;const node=sel.anchorNode;if(node.nodeType!==3)return null;const str=node.textContent.slice(0,sel.anchorOffset),m=str.match(/(?:^|\s)\/([^\s/]*)$/);return m?{node,start:sel.anchorOffset-m[1].length-1,end:sel.anchorOffset,query:m[1]}:null}
function hideMenu(){$('menu').classList.add('hidden');slash=null}
function showMenu(){slash=slashInfo();if(!slash||!lock)return hideMenu();const candidates=blocks.filter(b=>b[0].includes(slash.query)||b[1].includes(slash.query.toLowerCase()));if(!candidates.length)return hideMenu();const m=$('menu');m.replaceChildren();menuIndex=Math.min(menuIndex,candidates.length-1);const rect=$('body').getBoundingClientRect();m.style.left=Math.min(Math.max(12,rect.left+25),innerWidth-300)+'px';m.style.top=Math.min(rect.top+90,innerHeight-345)+'px';m.classList.remove('hidden');candidates.forEach((b,i)=>{let btn=document.createElement('button');btn.className=i===menuIndex?'chosen':'';btn.textContent=b[0];btn.onmousedown=e=>e.preventDefault();btn.onclick=()=>choose(b[1]);m.append(btn)})}
function choose(cmd){if(slash){const r=document.createRange();r.setStart(slash.node,slash.start);r.setEnd(slash.node,slash.end);r.deleteContents();const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}hideMenu();apply(cmd);dirty=true;$('body').focus()}
$('body').addEventListener('input',()=>{dirty=true;menuIndex=0;showMenu()});
$('body').addEventListener('keydown',e=>{if($('menu').classList.contains('hidden'))return;let buttons=[...$('menu').querySelectorAll('button')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();menuIndex=(menuIndex+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;showMenu()}else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();buttons[menuIndex]?.click()}else if(e.key==='Escape'){e.preventDefault();hideMenu()}});
$('body').addEventListener('change',e=>{if(e.target.matches('input[type=checkbox]')){if(!lock){e.target.checked=!e.target.checked;return}if(e.target.checked)e.target.setAttribute('checked','');else e.target.removeAttribute('checked');dirty=true}});
$('body').addEventListener('paste',e=>{if(!lock)return;const file=[...(e.clipboardData?.items||[])].find(x=>x.kind==='file'&&x.type.startsWith('image/'));if(file){e.preventDefault();upload(file.getAsFile(),'image')}else if(e.clipboardData?.getData('text/html')){e.preventDefault();insertHtml(e.clipboardData.getData('text/plain').split('\n').map(clean).join('<br>'))}});
$('body').addEventListener('click',e=>{if(e.target.tagName==='IMG'&&lock){const width=Number(prompt('이미지 너비 (80~1200px)',e.target.width));if(width>=80&&width<=1200){e.target.setAttribute('width',String(Math.round(width)));dirty=true}}if(e.target.tagName==='A'&&e.target.hash.startsWith('#page-')){e.preventDefault();openPage(e.target.hash.slice(6))}});
async function upload(file,type){if(!lock||!file)return;const isImage=type==='image';let ext=file.name?.split('.').pop()?.toLowerCase()||'';const res=await fetch('/api/'+(isImage?'image':'attachment'),{method:'POST',headers:{'X-Local-Token':token,'Content-Type':isImage?file.type:'application/octet-stream',...(isImage?{}:{'X-File-Extension':ext})},body:file});const j=await res.json();if(!res.ok)return alert(j.error);insertHtml(isImage?'<img src="'+j.url+'" alt="이미지">':'<p><a href="'+j.url+'">'+clean(file.name)+'</a></p>');status('첨부됨 · 저장 버튼을 눌러 주세요')}
function exportPdf(){if(!page)return;window.print()}
function showRelated(){if(!page)return;let target='#page-'+page.id,refs=pages.filter(p=>p.id!==page.id&&(p.content.includes(target)||p.content.includes('[['+page.title+']]')));let output=$('related');output.replaceChildren();let title=document.createElement('strong');title.textContent='이 페이지를 참조하는 문서 ('+refs.length+')';output.append(title);for(const p of refs){let b=document.createElement('button');b.textContent=p.title;b.onclick=()=>openPage(p.id);output.append(b)}output.classList.toggle('hidden',false)}
const draftKey=id=>'local_notion_draft_'+id;
function cacheDraft(){if(!lock||!page||!dirty)return;try{sessionStorage.setItem(draftKey(page.id),JSON.stringify({version:page.version,title:$('title').value,html:sanitize($('body').innerHTML),savedAt:new Date().toISOString()}));status('임시 초안이 이 브라우저에 저장됨 · 최종 반영은 저장 버튼')}catch(e){status('임시 초안 저장 실패 · 저장 버튼을 눌러 주세요')}}
function discardDraft(){if(page)try{sessionStorage.removeItem(draftKey(page.id))}catch(e){}}
function recoverDraft(){if(!page)return;let item;try{item=JSON.parse(sessionStorage.getItem(draftKey(page.id))||'null')}catch(e){return}if(!item||item.version!==page.version)return;const current=sanitize($('body').innerHTML);if(item.html!==current&&confirm('이 브라우저에 저장하지 않은 초안이 남아 있습니다. 복원할까요?')){$('body').innerHTML=sanitize(item.html);$('title').value=item.title;dirty=true;status('초안을 복원했습니다. 저장 버튼을 눌러야 공유 폴더에 반영됩니다.')}}
setInterval(cacheDraft,8000);
$('legacy').onclick=()=>location.href='/legacy';$('backlinks').onclick=showRelated;$('create').onclick=create;$('refresh').onclick=refresh;$('search').oninput=renderTree;$('edit').onclick=start;$('save').onclick=save;$('stop').onclick=async()=>{if(await leave())await refresh()};$('pdf').onclick=exportPdf;
for(const b of document.querySelectorAll('[data-cmd]'))b.onclick=()=>exec(b.dataset.cmd);$('block').onchange=e=>apply(e.target.value);$('highlight').onclick=()=>exec('hiliteColor','#fff1a8');$('check').onclick=todo;$('toggle').onclick=toggle;$('table').onclick=addTable;
$('link').onclick=()=>{let title=prompt('연결할 페이지 제목');if(!title)return;const p=pages.find(x=>x.title===title);if(!p)return alert('해당 제목의 페이지가 없습니다');insertHtml('<a href="#page-'+p.id+'">'+clean(title)+'</a>')};
$('image').onclick=()=>$('imagefile').click();$('file').onclick=()=>$('attachfile').click();$('imagefile').onchange=e=>upload(e.target.files[0],'image');$('attachfile').onchange=e=>upload(e.target.files[0],'attachment');$('title').oninput=()=>dirty=true;
window.addEventListener('beforeunload',e=>{if(lock){e.preventDefault();e.returnValue=''}});(async()=>{token=(await(await fetch('/api/session')).json()).token;$('owner').textContent='접속 PC: '+(await(await fetch('/api/session')).json()).owner;editing(false);await refresh()})().catch(e=>status(e.message))
</script></body></html>
