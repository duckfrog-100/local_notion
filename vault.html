<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개인 문서 보관함</title><style>body{max-width:850px;margin:40px auto;padding:20px;font-family:Arial,"Malgun Gothic",sans-serif;color:#333}button,input,textarea{font:inherit;padding:9px;border:1px solid #ddd;border-radius:5px;margin:4px}textarea{width:100%;height:350px;box-sizing:border-box;line-height:1.7}input{width:80%;box-sizing:border-box}.info{background:#fff8e8;padding:14px;line-height:1.6}.item{display:flex;align-items:center;margin:4px 0;gap:8px}.item button{flex:1;text-align:left}#status{color:#555}button{cursor:pointer}</style></head><body><p><a href="/">← 공유 페이지로 돌아가기</a></p><h1>개인 문서 보관함</h1><p class="info">이 기능은 실험용입니다. 암호화된 문서만 공유 폴더에 저장되지만, 파일을 삭제하거나 이전 파일로 바꾸는 행위까지 막지는 못합니다. 암호를 잃으면 복구할 수 없습니다. 기밀업무자료에는 보안 검증 전 사용하지 마세요.</p><div><button id="create">새 개인 문서</button><button id="reload">목록 새로고침</button></div><div id="items"></div><section id="editor" hidden><h2>암호화 문서 편집</h2><p>문서 ID: <code id="id"></code></p><input id="title" placeholder="제목"><textarea id="body" placeholder="내용"></textarea><p><button id="save">암호화하여 저장</button><button id="close">편집 종료</button></p><p id="status"></p></section><script>
const $=id=>document.getElementById(id);let token='',current=null,version=0,salt=null,password=null,lock=null,dirty=false;
function from64(str){return Uint8Array.from(atob(str),c=>c.charCodeAt(0))}
function to64(data){return btoa(String.fromCharCode(...data))}
async function keyFor(pass,s){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encode(value,pass,storedSalt){const saltBytes=storedSalt?from64(storedSalt):crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));let key=await keyFor(pass,saltBytes);let encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(value)));return {salt:to64(saltBytes),iv:to64(iv),ciphertext:to64(new Uint8Array(encrypted))}}
async function decode(file,pass){let key=await keyFor(pass,from64(file.salt));let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(file.iv)},key,from64(file.ciphertext));return JSON.parse(new TextDecoder().decode(plain))}
async function api(path,value){const res=await fetch('/api/'+path,{method:value===undefined?'GET':'POST',headers:{'X-Local-Token':token,...(value===undefined?{}:{'Content-Type':'application/json'})},body:value===undefined?undefined:JSON.stringify(value)});let data=await res.json();if(!res.ok)throw Error(data.error||'요청 오류');return data}
async function list(){const r=await api('vault/list');$('items').replaceChildren();for(const item of r.items){const row=document.createElement('div');row.className='item';const b=document.createElement('button');b.textContent='🔒 개인 문서 '+item.id.slice(0,8);b.onclick=()=>open(item.id);row.append(b);$('items').append(row)}}
async function close(){if(dirty&&!confirm('저장하지 않은 내용이 있습니다. 종료할까요?'))return false;if(lock){try{await api('unlock',{id:current,lock_token:lock})}catch(e){alert(e.message);return false}}current=null;lock=null;password=null;salt=null;version=0;dirty=false;$('editor').hidden=true;$('body').value='';$('title').value='';return true}
async function open(id){if(!await close())return;let p=prompt('개인 문서 암호를 입력해 주세요');if(p===null)return;let file;try{file=await api('vault/read',{id})}catch(e){alert(e.message);return}let plain;try{plain=await decode(file,p)}catch(e){return alert('암호가 틀렸거나 문서가 손상되었습니다')}try{let l=await api('lock',{id,vault:true});lock=l.lock_token}catch(e){return alert('다른 직원이 편집 중이거나 잠금이 남아 있습니다: '+e.message)}current=id;version=file.version;salt=file.salt;password=p;$('id').textContent=id;$('title').value=plain.title||'';$('body').value=plain.body||'';$('editor').hidden=false;dirty=false;$('status').textContent='잠금 확보됨'}
async function create(){if(!await close())return;const p=prompt('새 개인 문서 암호를 설정하세요 (12자 이상 권장)');if(p===null)return;if(p.length<12)return alert('암호는 12자 이상으로 설정해 주세요');const r=await api('vault/create',{});let l=await api('lock',{id:r.id,vault:true});current=r.id;lock=l.lock_token;password=p;version=0;salt=null;$('id').textContent=current;$('title').value='새 개인 문서';$('body').value='';$('editor').hidden=false;dirty=true}
async function save(){if(!lock||!current)return;try{const envelope=await encode({title:$('title').value,body:$('body').value},password,salt);const r=await api('vault/save',{id:current,lock_token:lock,version,...envelope});version=r.version;salt=envelope.salt;dirty=false;$('status').textContent='암호화되어 저장되었습니다';await list()}catch(e){alert(e.message)}}
$('create').onclick=create;$('reload').onclick=list;$('save').onclick=save;$('close').onclick=close;for(const id of ['title','body'])$(id).oninput=()=>dirty=true;window.addEventListener('beforeunload',e=>{if(lock){e.preventDefault();e.returnValue=''}});(async()=>{token=(await(await fetch('/api/session')).json()).token;await list()})().catch(e=>alert(e.message));
</script></body></html>
