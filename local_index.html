<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Notion · 공유 폴더</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;color:#37352f}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:6px;padding:8px;background:transparent;color:inherit}button:hover{background:#e8e8e6}.app{height:100vh;display:flex}.sidebar{width:260px;background:#f7f7f5;padding:15px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #ddd}.brand{font-weight:700;font-size:18px}.search{padding:9px;border-radius:6px;border:1px solid #ddd;width:100%}.tree{flex:1;overflow:auto}.node{display:flex;border-radius:6px}.node.active{background:#e9e9e7}.node button:first-child{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{flex:1;overflow:auto}.page{max-width:950px;margin:55px auto;padding:0 40px}.title{font-size:36px;font-weight:700;border:0;outline:0;width:100%;margin:30px 0 18px}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.toolbar button{background:#f0f0ee}.editor{width:100%;min-height:420px;border:1px solid #ddd;border-radius:7px;padding:14px;line-height:1.8;resize:vertical;font-family:Consolas,monospace}.preview{line-height:1.75}.preview img{max-width:100%}.sheet{border-collapse:collapse;width:100%;margin:12px 0}.sheet th,.sheet td{border:1px solid #ddd;padding:8px;text-align:left}.sheet th{background:#f5f5f3}.preview img{cursor:ew-resize}.knowledge{border:1px solid #ddd;border-radius:8px;padding:14px;margin-top:12px}.knowledge a{color:#3865a0}.preview blockquote{border-left:3px solid #ddd;padding-left:12px}.status,.muted{color:#777;font-size:12px}.status{margin:6px 0;min-height:22px}.blank{padding:120px 30px;text-align:center;color:#999}.alert{color:#a33}.private{background:#fffaee;padding:10px;border-radius:6px;font-size:12px;margin-top:6px}@media(max-width:650px){.sidebar{width:155px;padding:7px}.page{margin:10px auto;padding:10px}.title{font-size:27px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">▤ Local Notion</div><div id="owner" class="muted"></div><input id="search" class="search" placeholder="페이지 검색"><button id="create">＋ 새 페이지</button><button id="refresh">↻ 새로고침</button><button id="newTemplate">＋ CP 업무 템플릿</button><button id="backup">↧ 백업 생성</button><button id="trash">휴지통 보기</button><button id="vault">🔒 개인 문서함</button><button id="csvImport">CSV → 새 표</button><input id="csvFile" type="file" accept=".csv,text/csv" hidden><div class="tree" id="tree"></div><div class="muted">네트워크 공유 폴더 · 페이지별 잠금</div></aside><main class="right"><div class="blank" id="blank">왼쪽에서 페이지를 선택하세요.</div><div class="page" id="page" hidden><div class="toolbar"><button id="edit">편집 시작</button><button id="save" hidden>저장</button><button id="cancel" hidden>편집 종료</button><button id="toggle">미리보기</button><button id="image" hidden>이미지 업로드</button><button id="attachment" hidden>파일 첨부</button><input id="attachfile" type="file" accept=".pdf,.docx,.xlsx,.pptx,.csv" hidden><span class="muted">이미지를 클릭해 복사 · 편집창 Ctrl+V 붙여넣기</span><input type="file" id="file" hidden accept="image/png,image/jpeg,image/gif,image/webp"><button id="delete" hidden>삭제</button><button id="history">수정 이력</button><button id="links">지식 연결</button><button id="exportPdf">PDF로 내보내기</button><button id="table" hidden>표 삽입</button><button id="resize" hidden>이미지 크기</button></div><p class="status" id="status"></p><input id="title" class="title" disabled maxlength="200"><div><label class="muted">상위 페이지: <select id="parent" disabled></select></label></div><textarea id="editor" class="editor" disabled></textarea><div id="preview" class="preview" hidden></div><div id="knowledge" class="knowledge" hidden></div><div class="private">개인 페이지 암호화는 아직 지원하지 않습니다. 민감한 개인 문서를 저장하지 마세요.</div></div></main></div>
<script>
const $=s=>document.getElementById(s);let TOKEN='',pages=[],current=null,lockToken=null,dirty=false,previewMode=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function markup(s){
 const lines=s.split('\n'),out=[];
 for(let i=0;i<lines.length;){
  if(/^\|.*\|$/.test(lines[i])&&i+1<lines.length&&/^\|[\s|:\-]+\|$/.test(lines[i+1])){
   const header=lines[i].slice(1,-1).split('|').map(v=>v.trim());let j=i+2,rows=[];
   while(j<lines.length&&/^\|.*\|$/.test(lines[j])){rows.push(lines[j].slice(1,-1).split('|').map(v=>v.trim()));j++}
   out.push('<table class="sheet"><thead><tr>'+header.map(v=>'<th>'+esc(v)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');i=j;continue;
  }
  let x=lines[i++];x=x.replace(/\[\[([^\]]+)\]\]/g,(all,title)=>{let p=pages.find(k=>k.title===title);return p?'['+title+'](#page-'+p.id+')':all});
  let a=esc(x);
  a=a.replace(/!\[([^\]]*)\]\((\/images\/[a-f0-9]{32}\.(?:png|jpg|gif|webp))\s+"w=(\d{1,4})"\)/g,(_,alt,url,w)=>'<img alt="'+alt+'" src="'+url+'" style="width:min(100%,'+Math.min(1200,Math.max(80,Number(w)))+'px)">');
  a=a.replace(/!\[([^\]]*)\]\((\/images\/[a-f0-9]{32}\.(?:png|jpg|gif|webp))\)/g,'<img alt="$1" src="$2">').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  a=a.replace(/\[([^\]]+)\]\(#page-([a-f0-9]{32})\)/g,'<a href="#page-$2">$1</a>').replace(/\[([^\]]+)\]\((\/attachments\/[a-f0-9]{32}\.(?:pdf|docx|xlsx|pptx|csv))\)/g,'<a href="$2" download>$1 ⬇</a>');
  if(a.startsWith('### '))out.push('<h3>'+a.slice(4)+'</h3>');else if(a.startsWith('## '))out.push('<h2>'+a.slice(3)+'</h2>');else if(a.startsWith('# '))out.push('<h1>'+a.slice(2)+'</h1>');else out.push(a?'<p>'+a+'</p>':'<br>');
 }
 return out.join('');
}
async function api(path,data){let r=await fetch(path,{method:data===undefined?'GET':'POST',headers:{'X-Local-Token':TOKEN,...(data===undefined?{}:{'Content-Type':'application/json'})},body:data===undefined?undefined:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error+(j.lock?.owner?' ('+j.lock.owner+')':''));return j}
function status(s){$('status').textContent=s}
const TEMPLATES={'제품설명회 검토':'# 제품설명회 검토\n\n## 개최 정보\n- 일자: \n- 요양기관: \n- 제품명: \n\n## 증빙자료\n\n## 확인 사항\n\n## 판단 및 후속 조치\n','학회 후원 검토':'# 학회 후원 검토\n\n## 학회 및 행사\n\n## 지원 유형·금액\n\n## 규약·내부기준 검토\n\n## 승인 및 결과\n','내부심사':'# 내부심사\n\n## 대상 부서\n\n## 일정·심사원\n\n## 점검 결과\n\n## 개선 조치\n','지출보고서':'# 지출보고서\n\n## 대상 기간\n\n## 수집 범위\n\n## 검증 항목\n\n## 이슈 및 조치\n'};
function setEditing(edit){$('title').disabled=!edit;$('parent').disabled=!edit;$('editor').disabled=!edit;$('edit').hidden=edit;$('save').hidden=!edit;$('cancel').hidden=!edit;$('image').hidden=!edit;$('attachment').hidden=!edit;$('delete').hidden=!edit;$('table').hidden=!edit;$('resize').hidden=!edit}
function updatePreview(){$('preview').innerHTML=markup($('editor').value);$('editor').hidden=previewMode;$('preview').hidden=!previewMode;$('toggle').textContent=previewMode?'편집 화면':'미리보기'}
function renderTree(){let q=$('search').value.toLowerCase();$('tree').replaceChildren();let ids=new Set(pages.filter(p=>(p.title+' '+p.content).toLowerCase().includes(q)).map(p=>p.id));function show(id){if(!q)return true;let p=pages.find(p=>p.id===id);return ids.has(id)||pages.some(c=>c.parent_id===id&&show(c.id))}function visit(parent,depth){for(let p of pages.filter(p=>p.parent_id===parent)){if(!show(p.id))continue;let row=document.createElement('div');row.className='node'+(current?.id===p.id?' active':'');row.style.paddingLeft=(depth*12)+'px';let b=document.createElement('button');b.textContent='▤ '+p.title+(p.lock?' 🔒':'');b.onclick=()=>openPage(p.id);let add=document.createElement('button');add.textContent='+';add.title='하위 페이지';add.onclick=()=>createPage(p.id);row.append(b,add);$('tree').append(row);visit(p.id,depth+1)}}visit(null,0)}
function selectParents(){let opt=$('parent');opt.replaceChildren();let root=document.createElement('option');root.value='';root.textContent='최상위 페이지';opt.append(root);let excluded=new Set([current.id]);let loop=true;while(loop){loop=false;for(let p of pages)if(excluded.has(p.parent_id)&&!excluded.has(p.id)){excluded.add(p.id);loop=true}}for(let p of pages)if(!excluded.has(p.id)){let o=document.createElement('option');o.value=p.id;o.textContent=p.title;opt.append(o)}opt.value=current.parent_id||''}
async function release(){if(!lockToken)return true;if(dirty&&!confirm('저장하지 않은 변경 내용이 있습니다. 버릴까요?'))return false;try{await api('/api/unlock',{id:current.id,lock_token:lockToken})}catch(e){alert(e.message);return false}lockToken=null;dirty=false;setEditing(false);return true}
async function openPage(id){if(!await release())return;current=pages.find(p=>p.id===id);if(!current)return;$('blank').hidden=true;$('page').hidden=false;$('title').value=current.title;$('editor').value=current.content;selectParents();setEditing(false);status(current.lock?'다른 직원이 편집 중: '+(current.lock.owner||'알 수 없음'):'읽기 모드 — 편집 시작을 눌러 주세요');updatePreview();renderTree()}
async function refresh(){if(lockToken)return status('편집 중에는 새로고침할 수 없습니다. 먼저 저장하거나 편집을 종료하세요.');pages=(await api('/api/pages')).pages;let id=current?.id;if(id&&pages.some(p=>p.id===id))await openPage(id);else if(pages.length)await openPage(pages[0].id);else{$('page').hidden=true;$('blank').hidden=false}renderTree()}
async function startEdit(){if(!current)return;try{let r=await api('/api/lock',{id:current.id});lockToken=r.lock_token;setEditing(true);status('편집권 확보: 다른 직원은 현재 페이지를 편집할 수 없습니다.')}catch(e){alert(e.message);await refresh()}}
async function save(){if(!lockToken)return;try{let r=await api('/api/save',{id:current.id,lock_token:lockToken,version:current.version,title:$('title').value,content:$('editor').value,parent_id:$('parent').value||null});current.version=r.version;dirty=false;status('저장 완료');await release();await refresh()}catch(e){alert(e.message)}}
async function createPage(parent){if(!await release())return;try{let r=await api('/api/create',{title:'새 페이지',parent_id:parent});await refresh();await openPage(r.id)}catch(e){alert(e.message)}}
async function showHistory(){if(!current)return;try{let r=await api('/api/history?id='+current.id);let versions=r.versions.map(x=>x.version+' ('+x.updated_at+')').join('\n');if(!versions){alert('이전 버전이 없습니다.');return}let n=prompt('복원할 버전 번호를 입력하세요 (편집 시작 상태여야 복원 가능)\n'+versions);if(n===null)return;if(!lockToken)return alert('먼저 편집 시작을 누르세요');let v=Number(n);if(!Number.isSafeInteger(v))return;await api('/api/restore_version',{id:current.id,version:v,lock_token:lockToken});dirty=false;await release();await refresh();alert('이전 버전으로 복원했습니다.')}catch(e){alert(e.message)}}
async function showTrash(){try{const r=await api('/api/trash');if(!r.pages.length)return alert('휴지통이 비어 있습니다.');const pick=prompt('복원할 페이지 ID를 붙여 넣으세요:\n'+r.pages.map(x=>x.title+': '+x.id).join('\n'));if(!pick)return;await api('/api/restore_trash',{id:pick.trim()});await refresh()}catch(e){alert(e.message)}}
async function showLinks(){if(!current)return;const p=current;const incoming=pages.filter(x=>x.id!==p.id&&x.content.includes('[['+p.title+']]'));const outgoing=[...p.content.matchAll(/\[\[([^\]]+)\]\]/g)].map(x=>x[1]);const el=$('knowledge');el.hidden=!el.hidden;if(el.hidden)return;el.replaceChildren();const title=document.createElement('h3');title.textContent='업무 지식 연결';el.append(title);const section=(label,items)=>{const h=document.createElement('h4');h.textContent=label;el.append(h);if(!items.length){const p=document.createElement('p');p.textContent='연결된 페이지 없음';el.append(p)}for(const item of items){const row=document.createElement('p'),a=document.createElement('a');a.href='#';a.textContent=item.title;a.onclick=e=>{e.preventDefault();el.hidden=true;openPage(item.id)};row.append(a);el.append(row)}};section('이 페이지를 참고하는 문서',incoming);section('본문에서 연결한 문서',outgoing.map(name=>pages.find(x=>x.title===name)).filter(Boolean));}
function addText(text){if(!lockToken)return alert('먼저 편집 시작을 눌러주세요');const el=$('editor');let start=el.selectionStart,end=el.selectionEnd;el.setRangeText(text,start,end,'end');dirty=true;updatePreview();status('수정됨. 저장해 주세요.')}
function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
async function importCsv(file){if(!file)return;const raw=await file.text();if(raw.length>250000)return alert('250KB 이하 CSV만 지원합니다');let rows=parseCsv(raw);if(!rows.length)return;rows=rows.slice(0,300).map(r=>r.slice(0,20).map(v=>v.replace(/\|/g,'／').replace(/\r?\n/g,' ')));await createPage(null);await startEdit();if(!lockToken)return;const format=r=>'| '+r.join(' | ')+' |';$('title').value=file.name.replace(/\.csv$/i,'');$('editor').value='# '+file.name+'\n\n'+format(rows[0])+'\n'+format(rows[0].map(()=>'---'))+'\n'+rows.slice(1).map(format).join('\n');dirty=true;updatePreview();status('CSV 표를 가져왔습니다. 저장하세요.')}
function insertTable(){let cols=Math.min(12,Math.max(1,Number(prompt('열 개수 (1~12)',4))||4)),rows=Math.min(100,Math.max(1,Number(prompt('행 개수 (1~100)',5))||5));let header='| '+Array.from({length:cols},(_,i)=>'항목 '+(i+1)).join(' | ')+' |',separator='| '+Array(cols).fill('---').join(' | ')+' |';let contents=Array.from({length:rows},()=> '| '+Array(cols).fill(' ').join(' | ')+' |').join('\\n');addText('\\n'+header+'\\n'+separator+'\\n'+contents+'\\n');}
function resizeImage(){if(!lockToken)return alert('편집 시작 후 사용해 주세요');const width=Number(prompt('이미지 너비(px), 80~1200',480));if(!Number.isFinite(width)||width<80||width>1200)return;const el=$('editor'),start=el.selectionStart,end=el.selectionEnd;const original=el.value.slice(start,end);const match=original.match(/^!\\[([^\\]]*)\\]\\((\\/images\\/[a-f0-9]{32}\\.(?:png|jpg|gif|webp))(?:\\s+"w=\\d+")?\\)$/);if(!match)return alert('편집창에서 이미지 Markdown 문구 전체를 드래그하여 선택해 주세요');addText('!['+match[1]+']('+match[2]+' "w='+width+'")');}
function exportPdf(){if(!current)return;const w=window.open('','_blank');if(!w)return alert('팝업을 허용해 주세요');const doc=w.document;doc.open();doc.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>'+esc(current.title)+'</title><style>body{font-family:Malgun Gothic,Arial,sans-serif;max-width:850px;margin:40px auto;line-height:1.65;padding:0 20px}img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:7px}a{color:#333}@media print{body{margin:10mm auto}}</style></head><body><h1>'+esc($('title').value)+'</h1>'+markup($('editor').value)+'</body></html>');doc.close();w.focus();setTimeout(()=>w.print(),450);}
async function createTemplate(){const names=Object.keys(TEMPLATES),n=prompt('템플릿 번호를 입력하세요:\n'+names.map((x,i)=>(i+1)+'. '+x).join('\n'));if(!n)return;const index=Number(n)-1;if(!Number.isInteger(index)||!names[index])return;const name=names[index];await createPage(null);if(!current)return;await startEdit();if(!lockToken)return;$('title').value=name;$('editor').value=TEMPLATES[name];dirty=true;status('템플릿을 불러왔습니다. 저장하세요.')}
async function deletePage(){if(!lockToken||!confirm('이 페이지를 삭제할까요? 복구 기능은 아직 없습니다.'))return;try{await api('/api/delete',{id:current.id,lock_token:lockToken});lockToken=null;current=null;await refresh()}catch(e){alert(e.message)}}
function insertAtCursor(text){const ed=$('editor'),start=ed.selectionStart,end=ed.selectionEnd;ed.setRangeText(text,start,end,'end');dirty=true;updatePreview();status('이미지가 삽입되었습니다. 저장 버튼을 눌러주세요.')}
async function attach(file){if(!file||!lockToken)return;let ext=(file.name.split('.').pop()||'').toLowerCase();if(!['pdf','docx','xlsx','pptx','csv'].includes(ext))return alert('지원하지 않는 파일 형식입니다');try{let r=await fetch('/api/attachment',{method:'POST',headers:{'X-Local-Token':TOKEN,'X-File-Extension':ext},body:file});let j=await r.json();if(!r.ok)throw Error(j.error);$('editor').value+='\n['+file.name.replace(/[\[\]()]/g,'')+']('+j.url+')\n';dirty=true;updatePreview();status('파일이 첨부되었습니다. 저장하세요.')}catch(e){alert(e.message)}}
async function upload(file){if(!file||!lockToken)return;try{let r=await fetch('/api/image',{method:'POST',headers:{'X-Local-Token':TOKEN,'Content-Type':file.type},body:file}),j=await r.json();if(!r.ok)throw Error(j.error);insertAtCursor('\n!['+file.name.replace(/[\[\]()]/g,'')+']('+j.url+')\n')}catch(e){alert(e.message)}}
$('editor').addEventListener('paste',async e=>{if(!lockToken)return;const items=Array.from(e.clipboardData?.items||[]);const item=items.find(x=>x.kind==='file'&&x.type.startsWith('image/'));if(item){e.preventDefault();const file=item.getAsFile();if(file)await upload(file)}});
$('preview').addEventListener('dblclick',e=>{
 if(e.target.tagName!=='IMG'||!lockToken)return;
 const path=e.target.getAttribute('src');
 if(!/^\/images\/[a-f0-9]{32}\.(png|jpg|gif|webp)$/.test(path))return;
 const width=Number(prompt('이미지 너비(px, 80~1200)',Math.round(e.target.getBoundingClientRect().width)));
 if(!Number.isFinite(width)||width<80||width>1200)return;
 let replaced=false;
 const updated=$('editor').value.replace(/!\[([^\]]*)\]\((\/images\/[a-f0-9]{32}\.(?:png|jpg|gif|webp))(?:\s+"w=\d+")?\)/g,(all,alt,url)=>{
  if(replaced||url!==path)return all;
  replaced=true;return '!['+alt+']('+url+' "w='+Math.round(width)+'")';
 });
 if(replaced){$('editor').value=updated;dirty=true;updatePreview();status('이미지 크기를 변경했습니다. 저장하세요.')}
});
$('preview').addEventListener('click',async e=>{');const r=new RegExp('!\\[([^\\]]*)\\]\\('+escaped+'(?:\\s+"w=\\d+")?\\)');const next=text.replace(r,(_,alt)=>'!['+alt+']('+path+' "w='+Math.round(result)+'")');if(next!==text){$('editor').value=next;dirty=true;updatePreview();status('크기가 수정되었습니다. 저장하세요.')}});$('preview').addEventListener('click',async e=>{if(e.target.tagName!=='IMG')return;const src=e.target.getAttribute('src');if(!/^\/images\/[a-f0-9]{32}\.(png|jpg|gif|webp)$/.test(src))return;const md='!['+(e.target.alt||'이미지').replace(/[\[\]()]/g,'')+']('+src+')';try{await navigator.clipboard.writeText(md);status('이미지 참조를 복사했습니다. 다른 페이지를 편집한 뒤 Ctrl+V로 붙여넣으세요.')}catch(err){window.prompt('아래 이미지 참조를 복사하세요 (Ctrl+C)',md)}});
