<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Notion · 공유 폴더</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;color:#37352f}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:6px;padding:8px;background:transparent;color:inherit}button:hover{background:#e8e8e6}.app{height:100vh;display:flex}.sidebar{width:260px;background:#f7f7f5;padding:15px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #ddd}.brand{font-weight:700;font-size:18px}.search{padding:9px;border-radius:6px;border:1px solid #ddd;width:100%}.tree{flex:1;overflow:auto}.node{display:flex;border-radius:6px}.node.active{background:#e9e9e7}.node button:first-child{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{flex:1;overflow:auto}.page{max-width:950px;margin:55px auto;padding:0 40px}.title{font-size:36px;font-weight:700;border:0;outline:0;width:100%;margin:30px 0 18px}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.toolbar button{background:#f0f0ee}.editor{width:100%;min-height:420px;border:1px solid #ddd;border-radius:7px;padding:14px;line-height:1.8;resize:vertical;font-family:Consolas,monospace}.preview{line-height:1.75}.preview img{max-width:100%}.preview blockquote{border-left:3px solid #ddd;padding-left:12px}.status,.muted{color:#777;font-size:12px}.status{margin:6px 0;min-height:22px}.blank{padding:120px 30px;text-align:center;color:#999}.alert{color:#a33}.private{background:#fffaee;padding:10px;border-radius:6px;font-size:12px;margin-top:6px}@media(max-width:650px){.sidebar{width:155px;padding:7px}.page{margin:10px auto;padding:10px}.title{font-size:27px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">▤ Local Notion</div><div id="owner" class="muted"></div><input id="search" class="search" placeholder="페이지 검색"><button id="create">＋ 새 페이지</button><button id="refresh">↻ 새로고침</button><div class="tree" id="tree"></div><div class="muted">네트워크 공유 폴더 · 페이지별 잠금</div></aside><main class="right"><div class="blank" id="blank">왼쪽에서 페이지를 선택하세요.</div><div class="page" id="page" hidden><div class="toolbar"><button id="edit">편집 시작</button><button id="save" hidden>저장</button><button id="cancel" hidden>편집 종료</button><button id="toggle">미리보기</button><button id="image" hidden>이미지 업로드</button><input type="file" id="file" hidden accept="image/png,image/jpeg,image/gif,image/webp"><button id="delete" hidden>삭제</button></div><p class="status" id="status"></p><input id="title" class="title" disabled maxlength="200"><div><label class="muted">상위 페이지: <select id="parent" disabled></select></label></div><textarea id="editor" class="editor" disabled></textarea><div id="preview" class="preview" hidden></div><div class="private">개인 페이지 암호화는 아직 지원하지 않습니다. 민감한 개인 문서를 저장하지 마세요.</div></div></main></div>
<script>
const $=s=>document.getElementById(s);let TOKEN='',pages=[],current=null,lockToken=null,dirty=false,previewMode=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function markup(s){return s.split('\n').map(x=>{let a=esc(x).replace(/!\[([^\]]*)\]\((\/images\/[a-f0-9]{32}\.(?:png|jpg|gif|webp))\)/g,'<img alt="$1" src="$2">').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(a.startsWith('### '))return '<h3>'+a.slice(4)+'</h3>';if(a.startsWith('## '))return '<h2>'+a.slice(3)+'</h2>';if(a.startsWith('# '))return '<h1>'+a.slice(2)+'</h1>';return a?'<p>'+a+'</p>':'<br>'}).join('')}
async function api(path,data){let r=await fetch(path,{method:data===undefined?'GET':'POST',headers:{'X-Local-Token':TOKEN,...(data===undefined?{}:{'Content-Type':'application/json'})},body:data===undefined?undefined:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error+(j.lock?.owner?' ('+j.lock.owner+')':''));return j}
function status(s){$('status').textContent=s}
function setEditing(edit){$('title').disabled=!edit;$('parent').disabled=!edit;$('editor').disabled=!edit;$('edit').hidden=edit;$('save').hidden=!edit;$('cancel').hidden=!edit;$('image').hidden=!edit;$('delete').hidden=!edit}
function updatePreview(){$('preview').innerHTML=markup($('editor').value);$('editor').hidden=previewMode;$('preview').hidden=!previewMode;$('toggle').textContent=previewMode?'편집 화면':'미리보기'}
function renderTree(){let q=$('search').value.toLowerCase();$('tree').replaceChildren();let ids=new Set(pages.filter(p=>(p.title+' '+p.content).toLowerCase().includes(q)).map(p=>p.id));function show(id){if(!q)return true;let p=pages.find(p=>p.id===id);return ids.has(id)||pages.some(c=>c.parent_id===id&&show(c.id))}function visit(parent,depth){for(let p of pages.filter(p=>p.parent_id===parent)){if(!show(p.id))continue;let row=document.createElement('div');row.className='node'+(current?.id===p.id?' active':'');row.style.paddingLeft=(depth*12)+'px';let b=document.createElement('button');b.textContent='▤ '+p.title+(p.lock?' 🔒':'');b.onclick=()=>openPage(p.id);let add=document.createElement('button');add.textContent='+';add.title='하위 페이지';add.onclick=()=>createPage(p.id);row.append(b,add);$('tree').append(row);visit(p.id,depth+1)}}visit(null,0)}
function selectParents(){let opt=$('parent');opt.replaceChildren();let root=document.createElement('option');root.value='';root.textContent='최상위 페이지';opt.append(root);let excluded=new Set([current.id]);let loop=true;while(loop){loop=false;for(let p of pages)if(excluded.has(p.parent_id)&&!excluded.has(p.id)){excluded.add(p.id);loop=true}}for(let p of pages)if(!excluded.has(p.id)){let o=document.createElement('option');o.value=p.id;o.textContent=p.title;opt.append(o)}opt.value=current.parent_id||''}
async function release(){if(!lockToken)return true;if(dirty&&!confirm('저장하지 않은 변경 내용이 있습니다. 버릴까요?'))return false;try{await api('/api/unlock',{id:current.id,lock_token:lockToken})}catch(e){alert(e.message);return false}lockToken=null;dirty=false;setEditing(false);return true}
async function openPage(id){if(!await release())return;current=pages.find(p=>p.id===id);if(!current)return;$('blank').hidden=true;$('page').hidden=false;$('title').value=current.title;$('editor').value=current.content;selectParents();setEditing(false);status(current.lock?'다른 직원이 편집 중: '+(current.lock.owner||'알 수 없음'):'읽기 모드 — 편집 시작을 눌러 주세요');updatePreview();renderTree()}
async function refresh(){if(lockToken)return status('편집 중에는 새로고침할 수 없습니다. 먼저 저장하거나 편집을 종료하세요.');pages=(await api('/api/pages')).pages;let id=current?.id;if(id&&pages.some(p=>p.id===id))await openPage(id);else if(pages.length)await openPage(pages[0].id);else{$('page').hidden=true;$('blank').hidden=false}renderTree()}
async function startEdit(){if(!current)return;try{let r=await api('/api/lock',{id:current.id});lockToken=r.lock_token;setEditing(true);status('편집권 확보: 다른 직원은 현재 페이지를 편집할 수 없습니다.')}catch(e){alert(e.message);await refresh()}}
async function save(){if(!lockToken)return;try{let r=await api('/api/save',{id:current.id,lock_token:lockToken,version:current.version,title:$('title').value,content:$('editor').value,parent_id:$('parent').value||null});current.version=r.version;dirty=false;status('저장 완료');await release();await refresh()}catch(e){alert(e.message)}}
async function createPage(parent){if(!await release())return;try{let r=await api('/api/create',{title:'새 페이지',parent_id:parent});await refresh();await openPage(r.id)}catch(e){alert(e.message)}}
async function deletePage(){if(!lockToken||!confirm('이 페이지를 삭제할까요? 복구 기능은 아직 없습니다.'))return;try{await api('/api/delete',{id:current.id,lock_token:lockToken});lockToken=null;current=null;await refresh()}catch(e){alert(e.message)}}
async function upload(file){if(!file||!lockToken)return;try{let r=await fetch('/api/image',{method:'POST',headers:{'X-Local-Token':TOKEN,'Content-Type':file.type},body:file}),j=await r.json();if(!r.ok)throw Error(j.error);$('editor').value+='\n!['+file.name.replace(/[\[\]()]/g,'')+']('+j.url+')\n';dirty=true;updatePreview()}catch(e){alert(e.message)}}
$('create').onclick=()=>createPage(null);$('refresh').onclick=refresh;$('edit').onclick=startEdit;$('save').onclick=save;$('cancel').onclick=async()=>{if(await release())await refresh()};$('delete').onclick=deletePage;$('toggle').onclick=()=>{previewMode=!previewMode;updatePreview()};$('image').onclick=()=>$('file').click();$('file').onchange=e=>upload(e.target.files[0]);$('search').oninput=renderTree;for(let id of ['title','parent','editor'])$(id).addEventListener(id==='parent'?'change':'input',()=>{dirty=true;if(previewMode)updatePreview()});window.addEventListener('beforeunload',e=>{if(lockToken){e.preventDefault();e.returnValue=''}});(async()=>{let a=await(await fetch('/api/session')).json();TOKEN=a.token;$('owner').textContent=a.owner;await refresh()})().catch(e=>$('blank').textContent=e.message);
</script></body></html>
